# Git hooks manager. Commands run sequentially in the order below.
# module-size runs first, then eslint --fix, then prettier --write, so formatting always wins.
# stage_fixed re-stages files the tools modified, so fixes land in the commit.
#
# eslint runs from the repo root, and a flat config is resolved from the working
# directory, so without v10_config_lookup_from_file every staged file would be
# linted with the root config instead of the one in its own app or package.
# module-size runs first and changes no file, so a commit that is already too long is refused before eslint and
# prettier rewrite anything. module-size-final runs the same guard after prettier, because a formatter can reflow
# a 400 line file to 401 and the committed bytes are the ones that must meet the limit. Neither has a glob, because
# the guard asks git for the staged files itself.
# WHY prettier stages its own files: measured against lefthook 2.2.2, stage_fixed re-stages only after every command
# in the hook has finished, so module-size-final read the index before the reflowed file reached it and passed a
# 401 line file. prettier's glob covers every eslint glob, so this one git add also stages the eslint fixes before
# the final guard. It names only the staged files prettier was given, never the whole tree, and lefthook has already
# hidden the unstaged part of a partly staged file, so no unstaged work is pulled into the commit. Do not replace it
# with stage_fixed alone. scripts/module-size-guard.test.ts runs lefthook against this file to hold the order.
# The rule and its reasons are in scripts/module-size-guard.ts (sentinel-prod-8429 inventory row 2).
pre-commit:
  commands:
    module-size:
      priority: 1
      run: bun run scripts/module-size-guard.ts
    eslint:
      priority: 2
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: bunx eslint --flag v10_config_lookup_from_file --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    prettier:
      priority: 3
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,scss,md,mdx,yml,yaml,html}'
      run: bunx prettier --ignore-unknown --write {staged_files} && git add -- {staged_files}
      stage_fixed: true
    module-size-final:
      priority: 4
      run: bun run scripts/module-size-guard.ts

# Bead-id commit-msg guard (sentinel-prod-8429 inventory row 1, carried from sentinel-prod/.beads/hooks/commit-msg,
# bead sentinel-prod-ky5e): every commit subject must name the bead, because isolation says WHERE code landed and
# the bead ID says WHY it exists. The rule itself lives in scripts/git-guard-rules.ts so it is testable without a
# hook installed. Misty's NO-JAM law travels with it: BD_SKIP_BEAD_ID_CHECK=1 always bypasses, so this can never
# permanently block her. Merge subjects are exempt, and nothing else is.
# WHY the quoted zero and not the commit-msg-file template name: measured against lefthook 2.2.2 in a scratch
# repository. Lefthook hands the commit message file to the command as its first positional argument, and it
# passes the commit-msg-file template name through unexpanded, so a command written that way refuses every commit
# with its own unreadable-file code. The receipt is
# Output/reports/8429_qwen2_git_guard_atom_R1/scratch_hook_receipt_part1.log.
commit-msg:
  commands:
    bead-id:
      priority: 1
      run: bun run scripts/git-guard-rules.ts commit-msg "{0}"

# Shared-checkout rebase refusal (sentinel-prod-8429 inventory row 7, carried from
# sentinel-prod/.beads/hooks/pre-rebase after the 2026-08-06 incident): the shared checkout commits forward only,
# because a rebase there rewrites history other lanes already built on. This file is installed in lane worktrees
# too, so the guard asks git which checkout it is in and refuses only in the shared one, in its own words.
# git hands the pre-rebase hook the upstream as its first argument, and lefthook passes it through as "{0}", so
# the refusal can name the branch and the upstream it stopped.
pre-rebase:
  commands:
    shared-checkout:
      priority: 1
      run: bun run scripts/git-guard-rules.ts pre-rebase "{0}"

# Anchor-map landing restamp (sentinel-prod-8428): after a merge lands in this
# checkout — including a merge that carries a drizzle migration — re-stamp the
# unfinished issues whose exact anchored files changed in the landed range, so
# their cards carry fresh anchors and DRIFT lines. The runner is the shipped CLI
# and it is told it is a post-merge hook: its range is the recorded boundary to
# HEAD, or, in a checkout that has never stamped yet, git's own ORIG_HEAD (the
# pre-merge tip git writes before this hook runs) — never a guessed range. It
# always exits 0 and it advances its checkpoint only on a sweep that finished,
# so a stamp failure can neither fail the merge nor silently drop a range.
post-merge:
  commands:
    anchor-restamp:
      priority: 1
      run: bun run scripts/anchor_map_restamp.ts --post-merge
